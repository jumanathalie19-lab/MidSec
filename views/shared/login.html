<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Midview Security — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet">
<link rel="stylesheet" href="../../css/main.css"/>
<link rel="stylesheet" href="../../css/login.css"/>
</head>
<body>

<!-- Hero / branding -->
<div class="hero">
  <div class="shield">
    <svg viewBox="0 0 24 24">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
  </div>
  <h1>Midview Security</h1>
  <p>MIHANGO–UTAWALA · NAIROBI</p>
</div>

<!-- Login form -->
<div class="body">

  <!-- Alert area -->
  <div id="msg" class="msg" role="alert" aria-live="polite"></div>

  <!-- Email -->
  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" autocomplete="email"
           placeholder="you@example.com" required/>
  </div>

  <!-- Password with show/hide toggle -->
  <div class="field">
    <label for="password">Password</label>
    <div style="position:relative;">
      <input type="password" id="password" autocomplete="current-password"
             placeholder="Your password" required
             style="padding-right:44px;width:100%;box-sizing:border-box;"/>
      <button type="button" id="togglePw" aria-label="Show or hide password"
              onclick="togglePassword()"
              style="position:absolute;right:0;top:0;height:100%;
                     background:none;border:none;padding:0 12px;
                     cursor:pointer;color:var(--gray);font-size:16px;">
        👁
      </button>
    </div>
  </div>

  <!-- Submit -->
  <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
    <span id="loginBtnText">Sign in</span>
    <span id="loginSpinner" style="display:none;">…</span>
  </button>

  <p style="text-align:center;font-size:13px;color:var(--gray)">
    No account?
    <span class="link" onclick="window.location.href='register.html'">
      Register here
    </span>
  </p>

</div>

<script>
// ============================================================
//  Midview Security — Login
//  API: POST /api/auth/login
// ============================================================
const API = 'http://localhost/midview-security-app/api';

// ---- Auth guard: redirect if already logged in -------------
(function () {
  const t = localStorage.getItem('midview_token');
  const u = JSON.parse(localStorage.getItem('midview_user') || 'null');
  if (t && u) redirect(u.role);
})();

// ---- Password toggle ---------------------------------------
function togglePassword() {
  const pw  = document.getElementById('password');
  const btn = document.getElementById('togglePw');
  const hidden = pw.type === 'password';
  pw.type      = hidden ? 'text' : 'password';
  btn.textContent = hidden ? '🙈' : '👁';
  btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
}

// ---- Login -------------------------------------------------
async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !validateEmail(email)) {
    showMsg('Please enter a valid email address.', 'error'); return;
  }
  if (!password) {
    showMsg('Password is required.', 'error'); return;
  }

  setLoading(true);
  hideMsg();

  try {
    const res  = await fetch(`${API}/auth/login`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (res.ok && data.success) {
      localStorage.setItem('midview_token', data.data.token);
      localStorage.setItem('midview_user',  JSON.stringify(data.data.user));
      showMsg(`Welcome, ${data.data.user.first_name}! Redirecting…`, 'success');
      setTimeout(() => redirect(data.data.user.role), 900);

    } else {
      // 403 = deactivated or pending verification (show exact message)
      // 401 = wrong credentials (generic — no enumeration)
      const msg = res.status === 403
        ? data.message
        : 'Invalid email or password.';
      showMsg(msg, res.status === 403 ? 'info' : 'error');
    }

  } catch (err) {
    showMsg('Could not reach the server. Please check your connection.', 'error');
  } finally {
    setLoading(false);
  }
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ---- Helpers -----------------------------------------------
function redirect(role) {
  const map = {
    resident: '../resident/dashboard.html',
    guard:    '../guard/dashboard.html',
    admin:    '../admin/dashboard.html',
  };
  window.location.href = map[role] || 'login.html';
}

function validateEmail(e) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}

function showMsg(text, type) {
  const el      = document.getElementById('msg');
  el.textContent = text;
  el.className   = `msg ${type}`;
  el.style.display = 'block';
}

function hideMsg() {
  document.getElementById('msg').style.display = 'none';
}

function setLoading(on) {
  const btn     = document.getElementById('loginBtn');
  const txt     = document.getElementById('loginBtnText');
  const spin    = document.getElementById('loginSpinner');
  btn.disabled      = on;
  txt.textContent   = on ? 'Signing in' : 'Sign in';
  spin.style.display = on ? 'inline' : 'none';
}
</script>
</body>
</html>
