<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Midview — Guard Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet">
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  rgba(255,255,255,.08);
    --text:    #e6edf3;
    --gray:    #7d8590;
    --accent:  #58a6ff;
    --danger:  #f85149;
    --danger2: #ff7b72;
    --success: #3fb950;
    --warn:    #d29922;
    --navy:    #102a43;
    --gold:    #d4a017;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    min-height:100vh; display:flex; flex-direction:column;
  }
  /* Top bar */
  .topbar {
    background:var(--navy);
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .topbar-brand {
    display:flex; align-items:center; gap:10px;
  }
  .topbar-brand svg {
    width:22px; height:22px; stroke:#fff; fill:none; stroke-width:1.8;
  }
  .topbar-brand h1 {
    font-family:var(--font-head); font-size:16px; font-weight:700; color:#fff;
  }
  .duty-badge {
    background:rgba(63,185,80,.15); color:var(--success);
    border:1px solid rgba(63,185,80,.3);
    padding:4px 10px; border-radius:20px;
    font-size:11px; font-weight:500;
    display:flex; align-items:center; gap:5px;
  }
  .duty-dot { width:6px; height:6px; border-radius:50%; background:var(--success); }
  /* Content */
  .main { flex:1; padding:16px; max-width:900px; margin:0 auto; width:100%; }
  /* Stats row */
  .stats-row {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin-bottom:16px;
  }
  .stat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 12px; text-align:center;
  }
  .stat-card .num {
    font-family:var(--font-head); font-size:26px; font-weight:700;
  }
  .stat-card .lbl { font-size:11px; color:var(--gray); margin-top:3px; }
  .num-danger  { color:var(--danger2); }
  .num-warn    { color:var(--warn); }
  .num-success { color:var(--success); }
  /* Cards */
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:14px;
  }
  .card h3 {
    font-family:var(--font-head); font-size:13px; font-weight:600;
    color:var(--gray); text-transform:uppercase; letter-spacing:.5px;
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .card h3 .count-pill {
    background:var(--danger); color:#fff; font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:10px; font-family:var(--font-body);
    text-transform:none; letter-spacing:0;
  }
  /* Panic alert row */
  .panic-row {
    background:rgba(248,81,73,.06); border:1px solid rgba(248,81,73,.2);
    border-radius:10px; padding:14px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .panic-row-top {
    display:flex; align-items:center; justify-content:space-between;
  }
  .panic-name {
    font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .pulse-dot {
    width:8px; height:8px; border-radius:50%; background:var(--danger);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.4; transform:scale(.8); }
  }
  .panic-meta { font-size:11px; color:var(--gray); }
  .panic-actions { display:flex; gap:8px; flex-wrap:wrap; }
  /* Incident row */
  .inc-row {
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .inc-row:last-child { border-bottom:none; padding-bottom:0; }
  .inc-dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
  }
  .dot-open     { background:var(--danger2); }
  .dot-review   { background:var(--warn); }
  .dot-resolved { background:var(--success); }
  .inc-info { flex:1; min-width:0; }
  .inc-title { font-size:13px; font-weight:500; }
  .inc-sub   { font-size:11px; color:var(--gray); margin-top:2px;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Badges */
  .badge {
    font-size:10px; font-weight:600; padding:3px 8px;
    border-radius:10px; white-space:nowrap; flex-shrink:0;
  }
  .b-open     { background:rgba(248,81,73,.15);  color:var(--danger2); }
  .b-review   { background:rgba(210,153,34,.15); color:var(--warn); }
  .b-resolved { background:rgba(63,185,80,.15);  color:var(--success); }
  /* Buttons */
  .btn {
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:500;
    cursor:pointer; border:none; font-family:var(--font-body);
    transition:opacity .2s;
  }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-danger  { background:rgba(248,81,73,.15);  color:var(--danger2);
                 border:1px solid rgba(248,81,73,.3); }
  .btn-primary { background:var(--accent); color:#0d1117; font-weight:600; }
  .btn-ghost   { background:transparent; color:var(--gray);
                 border:1px solid var(--border); }
  .btn:hover:not(:disabled) { opacity:.8; }
  /* Bottom nav */
  .bottomnav {
    position:sticky; bottom:0; background:var(--surface);
    border-top:1px solid var(--border);
    display:flex; justify-content:space-around; padding:10px 0 14px;
  }
  .navitem {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--gray); cursor:pointer;
    font-family:var(--font-body); font-size:10px; padding:4px 14px;
    transition:color .2s;
  }
  .navitem svg {
    width:20px; height:20px; stroke:currentColor;
    fill:none; stroke-width:1.5;
  }
  .navitem.active { color:var(--accent); }
  /* Loading */
  .loading {
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--gray); padding:8px 0;
  }
  .spinner {
    width:14px; height:14px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { font-size:12px; color:var(--gray); padding:8px 0; }
  .msg {
    padding:10px 14px; border-radius:8px; font-size:13px;
    margin-bottom:12px; display:none;
  }
  .msg.success { background:rgba(63,185,80,.1);  color:var(--success);
                 border:1px solid rgba(63,185,80,.2); display:block; }
  .msg.error   { background:rgba(248,81,73,.1);  color:var(--danger2);
                 border:1px solid rgba(248,81,73,.2); display:block; }
  .msg.info    { background:rgba(88,166,255,.08); color:var(--accent);
                 border:1px solid rgba(88,166,255,.2); display:block; }
  .section-link {
    font-size:12px; color:var(--accent); text-decoration:none;
    float:right; font-weight:500;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/>
    </svg>
    <h1>Midview Guard</h1>
  </div>
  <div class="duty-badge">
    <div class="duty-dot"></div>
    <span id="guardName">On duty</span>
  </div>
</div>

<!-- Main content -->
<div class="main">

  <div id="msgBox" class="msg"></div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="num num-danger" id="statActive">—</div>
      <div class="lbl">Active panics</div>
    </div>
    <div class="stat-card">
      <div class="num num-warn" id="statOpen">—</div>
      <div class="lbl">Open incidents</div>
    </div>
    <div class="stat-card">
      <div class="num num-success" id="statResolved">—</div>
      <div class="lbl">Resolved today</div>
    </div>
  </div>

  <!-- Active Panics -->
  <div class="card">
    <h3>
      🚨 Active panic alerts
      <span class="count-pill" id="panicCount">0</span>
      <a href="panic.html" class="section-link">View all →</a>
    </h3>
    <div id="activePanics">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- Open Incidents -->
  <div class="card">
    <h3>
      Open incidents
      <a href="incidents.html" class="section-link">View all →</a>
    </h3>
    <div id="openIncidents">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

</div>

<!-- Bottom nav -->
<div class="bottomnav">
  <button class="navitem active" onclick="goto('dashboard.html')">
    <svg viewBox="0 0 24 24">
      <path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
    </svg>
    Home
  </button>
  <button class="navitem" onclick="goto('panic.html')">
    <svg viewBox="0 0 24 24">
      <path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    </svg>
    Panics
  </button>
  <button class="navitem" onclick="goto('incidents.html')">
    <svg viewBox="0 0 24 24">
      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    Incidents
  </button>
  <button class="navitem" onclick="goto('cctv.html')">
    <svg viewBox="0 0 24 24">
      <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
    </svg>
    CCTV
  </button>
  <button class="navitem" onclick="guardLogout()"
          style="color:var(--danger2);">
    <svg viewBox="0 0 24 24">
      <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
    </svg>
    Logout
  </button>
</div>

<script>
// ============================================================
//  Midview — Guard Dashboard
//  Auth:  JWT (guard or admin role)
//  APIs:  GET /api/panic/active
//         GET /api/incidents?status=open
// ============================================================
const API = 'http://localhost/midview-security-app/api';

// ---- Auth guard --------------------------------------------
const token = localStorage.getItem('midview_token');
const user  = JSON.parse(localStorage.getItem('midview_user') || 'null');
if (!token || !user || !['guard','admin'].includes(user.role)) {
  window.location.href = '../shared/login.html';
}

document.getElementById('guardName').textContent =
  `${user.first_name} ${user.last_name[0]}.`;

function authHeaders() {
  return {
    'Authorization': `Bearer ${token}`,
    'Content-Type':  'application/json',
  };
}

function handleUnauth() {
  localStorage.removeItem('midview_token');
  localStorage.removeItem('midview_user');
  window.location.href = '../shared/login.html';
}

function goto(page) { window.location.href = page; }

// ---- Helpers -----------------------------------------------
function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60)    return `${s}s ago`;
  if (s < 3600)  return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return             `${Math.floor(s/86400)}d ago`;
}

function typeLabel(t) {
  return { suspicious_activity:'Suspicious activity',
           theft_breakin:'Theft / break-in',
           property_damage:'Property damage' }[t] || t;
}

// ---- Load active panics ------------------------------------
// GET /api/panic/active — guard/admin only
// Returns: resident_phone, cctv_url, GPS coordinates, minutes_elapsed
async function loadActivePanics() {
  try {
    const res  = await fetch(`${API}/panic/active`, { headers: authHeaders() });
    if (res.status === 401) { handleUnauth(); return; }

    const data = await res.json();
    const el   = document.getElementById('activePanics');
    const pill = document.getElementById('panicCount');

    if (!data.success || !data.data?.length) {
      pill.textContent = '0';
      pill.style.background = 'rgba(63,185,80,.4)';
      el.innerHTML = '<p class="empty">✅ No active panic alerts.</p>';
      document.getElementById('statActive').textContent = '0';
      return;
    }

    const panics = data.data;
    pill.textContent = panics.length;
    document.getElementById('statActive').textContent = panics.length;

    el.innerHTML = panics.map(p => `
      <div class="panic-row">
        <div class="panic-row-top">
          <div class="panic-name">
            <div class="pulse-dot"></div>
            ${p.resident_name}
          </div>
          <span style="font-size:11px;color:var(--danger2);">
            ${p.minutes_elapsed}m ago
          </span>
        </div>
        <div class="panic-meta">
          🏠 ${p.house_no}
          ${p.resident_phone ? ` · 📞 ${p.resident_phone}` : ''}
          ${p.cctv_feed      ? ` · 📷 ${p.cctv_feed}`     : ''}
        </div>
        <div class="panic-meta">
          📍 ${p.latitude}, ${p.longitude}
        </div>
        <div class="panic-actions">
          <button class="btn btn-danger"
                  onclick="respondPanic(${p.alert_id}, this)">
            Respond
          </button>
          ${p.cctv_url
            ? `<a href="${p.cctv_url}" target="_blank" rel="noopener"
                  class="btn btn-ghost">View feed</a>`
            : ''}
          <button class="btn btn-ghost"
                  onclick="goto('panic.html')">
            Full view
          </button>
        </div>
      </div>`).join('');

  } catch (err) {
    document.getElementById('activePanics').innerHTML =
      '<p class="empty">Could not load active panics.</p>';
  }
}

// ---- Respond to panic --------------------------------------
// PATCH /api/panic/{id}/respond
// Uses SELECT FOR UPDATE in the procedure — no retry logic here
async function respondPanic(alertId, btn) {
  btn.disabled    = true;
  btn.textContent = 'Responding…';

  try {
    const res  = await fetch(`${API}/panic/${alertId}/respond`, {
      method:  'PATCH',
      headers: authHeaders(),
    });
    if (res.status === 401) { handleUnauth(); return; }

    const data = await res.json();

    if (res.ok && data.success) {
      showMsg('✅ You have been assigned. Head to the location now.', 'success');
      loadActivePanics();
    } else if (res.status === 409) {
      showMsg('Another guard has already responded to this alert.', 'info');
      loadActivePanics();
    } else {
      showMsg(data.message || 'Could not respond to alert.', 'error');
      btn.disabled    = false;
      btn.textContent = 'Respond';
    }
  } catch (err) {
    showMsg('Server error. Please try again.', 'error');
    btn.disabled    = false;
    btn.textContent = 'Respond';
  }
}

// ---- Load open incidents -----------------------------------
// GET /api/incidents?status=open
async function loadOpenIncidents() {
  try {
    const res  = await fetch(`${API}/incidents?status=open`, {
      headers: authHeaders(),
    });
    if (res.status === 401) { handleUnauth(); return; }

    const data = await res.json();
    const el   = document.getElementById('openIncidents');

    if (!data.success || !data.data?.length) {
      document.getElementById('statOpen').textContent = '0';
      el.innerHTML = '<p class="empty">No open incidents.</p>';
      return;
    }

    const list = data.data;
    document.getElementById('statOpen').textContent = list.length;

    // Count resolved today for stat
    const today     = new Date().toDateString();
    const resolvedToday = list.filter(
      i => i.status === 'resolved' &&
           new Date(i.updated_at).toDateString() === today
    ).length;
    document.getElementById('statResolved').textContent = resolvedToday;

    el.innerHTML = list.slice(0, 5).map(i => `
      <div class="inc-row">
        <div class="inc-dot dot-open"></div>
        <div class="inc-info">
          <div class="inc-title">${typeLabel(i.incident_type)}</div>
          <div class="inc-sub">
            🏠 ${i.house_no} · ${timeAgo(i.reported_at)}
          </div>
        </div>
        <button class="btn btn-ghost"
                style="font-size:11px;padding:5px 10px;"
                onclick="goto('incidents.html')">
          Handle
        </button>
      </div>`).join('');

  } catch (err) {
    document.getElementById('openIncidents').innerHTML =
      '<p class="empty">Could not load incidents.</p>';
  }
}

function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className   = `msg ${type}`;
  setTimeout(() => { el.className = 'msg'; }, 5000);
}

function guardLogout() {
  if (!confirm('Sign out?')) return;
  localStorage.removeItem('midview_token');
  localStorage.removeItem('midview_user');
  window.location.href = '../shared/login.html';
}

// ---- Auto-refresh active panics every 30s ------------------
loadActivePanics();
loadOpenIncidents();
setInterval(loadActivePanics, 30000);
</script>
</body>
</html>
