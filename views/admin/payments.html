<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Midview Admin — Payments</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:rgba(255,255,255,.08);
        --text:#e6edf3;--gray:#7d8590;--accent:#58a6ff;
        --danger2:#ff7b72;--success:#3fb950;--warn:#d29922;
        --navy:#102a43;--gold:#d4a017;
        --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
       min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--navy);padding:14px 20px;display:flex;
          align-items:center;gap:10px;position:sticky;top:0;z-index:100;
          border-bottom:1px solid rgba(255,255,255,.06);}
  .back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .topbar h1{font-family:var(--font-head);font-size:16px;font-weight:700;}
  .main{flex:1;padding:16px;max-width:900px;margin:0 auto;width:100%;}
  /* Date row */
  .date-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .date-row label{font-size:12px;color:var(--gray);}
  .date-row input{background:var(--surface);border:1px solid var(--border);
                  color:var(--text);padding:6px 10px;border-radius:8px;
                  font-family:var(--font-body);font-size:12px;}
  .btn-load{background:var(--accent);color:#0d1117;border:none;
            padding:7px 14px;border-radius:8px;font-size:12px;
            font-weight:600;cursor:pointer;font-family:var(--font-body);}
  /* Tabs */
  .tabs{display:flex;gap:4px;background:var(--surface);border-radius:10px;
        padding:4px;margin-bottom:14px;}
  .tab{flex:1;padding:8px;text-align:center;font-size:12px;border-radius:8px;
       cursor:pointer;border:none;background:transparent;color:var(--gray);
       font-family:var(--font-body);}
  .tab.active{background:var(--accent);color:#0d1117;font-weight:600;}
  /* Stats */
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);
             border-radius:10px;padding:12px;text-align:center;}
  .stat-card .num{font-family:var(--font-head);font-size:22px;font-weight:700;}
  .stat-card .lbl{font-size:11px;color:var(--gray);margin-top:3px;}
  .num-success{color:var(--success);} .num-warn{color:var(--warn);}
  .num-gold{color:var(--gold);}
  /* Filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filter-btn{background:var(--surface);border:1px solid var(--border);
              color:var(--gray);padding:5px 12px;border-radius:20px;
              font-size:12px;cursor:pointer;font-family:var(--font-body);}
  .filter-btn.active{background:var(--accent);color:#0d1117;
                     border-color:var(--accent);font-weight:600;}
  /* Payment rows */
  .pay-row{display:flex;align-items:center;gap:10px;
           padding:12px 0;border-bottom:1px solid var(--border);}
  .pay-row:last-child{border-bottom:none;}
  .pay-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;
              background:rgba(88,166,255,.1);color:var(--accent);
              display:flex;align-items:center;justify-content:center;
              font-size:13px;font-weight:700;}
  .pay-info{flex:1;min-width:0;}
  .pay-name{font-size:13px;font-weight:500;}
  .pay-sub{font-size:11px;color:var(--gray);margin-top:2px;}
  .pay-amount{font-family:var(--font-head);font-size:15px;font-weight:700;
              flex-shrink:0;}
  /* Overdue */
  .overdue-row{display:flex;align-items:center;gap:10px;
               padding:10px 0;border-bottom:1px solid var(--border);}
  .overdue-row:last-child{border-bottom:none;}
  /* Badges */
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;}
  .b-completed{background:rgba(63,185,80,.15);color:var(--success);}
  .b-pending{background:rgba(210,153,34,.15);color:var(--warn);}
  .b-failed{background:rgba(248,81,73,.15);color:var(--danger2);}
  .b-active{background:rgba(63,185,80,.15);color:var(--success);}
  .b-expired{background:rgba(248,81,73,.15);color:var(--danger2);}
  .b-never{background:rgba(125,133,144,.1);color:var(--gray);}
  /* Monthly chart placeholder */
  .chart-bar-wrap{margin-top:10px;}
  .chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .chart-label{font-size:11px;color:var(--gray);width:60px;flex-shrink:0;}
  .chart-bar-bg{flex:1;background:rgba(255,255,255,.05);border-radius:4px;height:8px;}
  .chart-bar-fill{height:8px;border-radius:4px;background:var(--accent);}
  .chart-val{font-size:11px;color:var(--gray);width:70px;text-align:right;flex-shrink:0;}
  .card{background:var(--surface);border:1px solid var(--border);
        border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h3{font-family:var(--font-head);font-size:13px;font-weight:600;
           color:var(--gray);text-transform:uppercase;letter-spacing:.5px;
           margin-bottom:12px;}
  .bottomnav{position:sticky;bottom:0;background:var(--surface);
             border-top:1px solid var(--border);
             display:flex;justify-content:space-around;padding:10px 0 14px;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:3px;
           background:none;border:none;color:var(--gray);cursor:pointer;
           font-family:var(--font-body);font-size:10px;padding:4px 10px;}
  .navitem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;}
  .navitem.active{color:var(--gold);}
  .loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray);padding:8px 0;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);
           border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
  .msg.error{background:rgba(248,81,73,.1);color:var(--danger2);
             border:1px solid rgba(248,81,73,.2);display:block;}
  .empty{font-size:12px;color:var(--gray);text-align:center;padding:12px 0;}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="goto('dashboard.html')">←</button>
  <h1>Payments</h1>
</div>

<div class="main">
  <div id="msgBox" class="msg"></div>

  <!-- Date range -->
  <div class="date-row">
    <label>From</label><input type="date" id="dateFrom"/>
    <label>To</label><input type="date" id="dateTo"/>
    <button class="btn-load" onclick="loadStats()">Load stats</button>
  </div>

  <!-- Stats cards -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="num num-gold" id="statRevenue">—</div>
      <div class="lbl">Revenue (KES)</div>
    </div>
    <div class="stat-card">
      <div class="num num-success" id="statActive">—</div>
      <div class="lbl">Active subs</div>
    </div>
    <div class="stat-card">
      <div class="num num-warn" id="statOverdue">—</div>
      <div class="lbl">Overdue</div>
    </div>
  </div>

  <!-- Revenue chart -->
  <div class="card" id="chartCard" style="display:none;">
    <h3>Monthly revenue</h3>
    <div class="chart-bar-wrap" id="chartBars"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('all')">All payments</button>
    <button class="tab"        onclick="showTab('overdue')">Overdue</button>
  </div>

  <!-- All payments tab -->
  <div id="tabAll">
    <div class="filters">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="completed">Completed</button>
      <button class="filter-btn" data-status="pending">Pending</button>
      <button class="filter-btn" data-status="failed">Failed</button>
    </div>
    <div id="allPayments">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- Overdue tab -->
  <div id="tabOverdue" style="display:none;">
    <div id="overdueList">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<div class="bottomnav">
  <button class="navitem" onclick="goto('dashboard.html')">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
    Home
  </button>
  <button class="navitem" onclick="goto('residents.html')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    Residents
  </button>
  <button class="navitem" onclick="goto('incidents.html')">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    Incidents
  </button>
  <button class="navitem active" onclick="goto('payments.html')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    Payments
  </button>
  <button class="navitem" onclick="goto('reports.html')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Reports
  </button>
</div>

<script>
const API = 'http://localhost/midview-security-app/api';
const token = localStorage.getItem('midview_token');
const user  = JSON.parse(localStorage.getItem('midview_user') || 'null');
if (!token || !user || user.role !== 'admin') {
  window.location.href = '../shared/login.html';
}
function authHeaders() {
  return { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json' };
}
function handleUnauth() {
  localStorage.removeItem('midview_token');
  localStorage.removeItem('midview_user');
  window.location.href = '../shared/login.html';
}
function goto(p) { window.location.href = p; }

let activeStatus = '';

// Set default dates
(function() {
  const now  = new Date();
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  document.getElementById('dateTo').value   = now.toISOString().slice(0,10);
})();

// ---- Tabs --------------------------------------------------
document.querySelectorAll('[data-status]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-status]').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    activeStatus = this.dataset.status;
    loadAllPayments();
  });
});

function showTab(tab) {
  document.getElementById('tabAll').style.display     = tab==='all'     ? 'block':'none';
  document.getElementById('tabOverdue').style.display = tab==='overdue' ? 'block':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('active',['all','overdue'][i]===tab);
  });
  if (tab==='all')     loadAllPayments();
  if (tab==='overdue') loadOverdue();
}

// ---- Load statistics ----------------------------------------
// GET /api/payments/statistics — returns 2 result sets
async function loadStats() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (!from||!to) return;

  try {
    const res  = await fetch(
      `${API}/payments/statistics?date_from=${from}&date_to=${to}`,
      { headers: authHeaders() }
    );
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();
    if (!data.success) return;

    const s   = data.data.overall_summary  || {};
    const mon = data.data.monthly_breakdown || [];

    document.getElementById('statRevenue').textContent =
      s.total_revenue_ksh != null
        ? Number(s.total_revenue_ksh).toLocaleString() : '—';
    document.getElementById('statActive').textContent =
      s.active_subscriptions ?? '—';

    // Revenue chart (simple bar chart using divs)
    if (mon.length) {
      const maxRev = Math.max(...mon.map(m=>Number(m.monthly_revenue_ksh)||0));
      document.getElementById('chartBars').innerHTML = mon.map(m=>{
        const rev = Number(m.monthly_revenue_ksh)||0;
        const pct = maxRev > 0 ? Math.round((rev/maxRev)*100) : 0;
        return `
          <div class="chart-bar-row">
            <div class="chart-label">${m.month_name?.slice(0,3)} ${m.report_year}</div>
            <div class="chart-bar-bg">
              <div class="chart-bar-fill" style="width:${pct}%"></div>
            </div>
            <div class="chart-val">KES ${rev.toLocaleString()}</div>
          </div>`;
      }).join('');
      document.getElementById('chartCard').style.display='block';
    }
  } catch {}
}

// ---- Load all payments -------------------------------------
// GET /api/payments — admin only, contains mpesa_ref + phone
async function loadAllPayments() {
  const el = document.getElementById('allPayments');
  el.innerHTML='<div class="loading"><div class="spinner"></div> Loading…</div>';

  let url = `${API}/payments`;
  if (activeStatus) url += `?status=${activeStatus}`;

  try {
    const res  = await fetch(url, { headers: authHeaders() });
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();

    if (!data.success||!data.data?.length) {
      el.innerHTML='<p class="empty">No payments found.</p>'; return;
    }

    const badge = s => ({
      completed:'<span class="badge b-completed">Completed</span>',
      pending:  '<span class="badge b-pending">Pending</span>',
      failed:   '<span class="badge b-failed">Failed</span>',
    }[s]||s);

    el.innerHTML = data.data.map(p=>`
      <div class="pay-row">
        <div class="pay-avatar">
          ${(p.resident_name||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()}
        </div>
        <div class="pay-info">
          <div class="pay-name">${p.resident_name} · 🏠 ${p.house_no}</div>
          <div class="pay-sub">
            ${p.resident_phone}
            ${p.mpesa_ref ? ` · ${p.mpesa_ref}` : ''}
            · ${new Date(p.paid_at).toLocaleDateString()}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <div class="pay-amount" style="color:${
            p.payment_status==='completed' ? 'var(--success)'
          : p.payment_status==='failed'    ? 'var(--danger2)'
          : 'var(--warn)'}">
            KES ${Number(p.amount).toLocaleString()}
          </div>
          ${badge(p.payment_status)}
        </div>
      </div>`).join('');
  } catch {
    el.innerHTML='<p class="empty">Could not load payments.</p>';
  }
}

// ---- Load overdue subscriptions ----------------------------
// GET /api/payments/overdue — admin only
async function loadOverdue() {
  const el = document.getElementById('overdueList');
  el.innerHTML='<div class="loading"><div class="spinner"></div> Loading…</div>';

  try {
    const res  = await fetch(`${API}/payments/overdue`, { headers: authHeaders() });
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();

    document.getElementById('statOverdue').textContent =
      data.success && data.data ? data.data.length : '—';

    if (!data.success||!data.data?.length) {
      el.innerHTML='<p class="empty">All residents have active subscriptions. ✅</p>'; return;
    }

    const badge = cat => ({
      never_paid:'<span class="badge b-never">Never paid</span>',
      expired:   '<span class="badge b-expired">Expired</span>',
    }[cat]||cat);

    el.innerHTML = data.data.map(r=>`
      <div class="overdue-row">
        <div class="pay-avatar">
          ${(r.resident_name||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()}
        </div>
        <div class="pay-info">
          <div class="pay-name">${r.resident_name} · 🏠 ${r.house_no}</div>
          <div class="pay-sub">
            📞 ${r.resident_phone}
            ${r.days_overdue !== null ? ` · ${r.days_overdue} days overdue` : ''}
          </div>
        </div>
        ${badge(r.overdue_category)}
      </div>`).join('');
  } catch {
    el.innerHTML='<p class="empty">Could not load overdue list.</p>';
  }
}

loadStats();
loadAllPayments();
</script>
</body>
</html>
