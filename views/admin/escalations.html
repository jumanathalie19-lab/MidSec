<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Midview Admin — Escalations</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:rgba(255,255,255,.08);
        --text:#e6edf3;--gray:#7d8590;--accent:#58a6ff;
        --danger2:#ff7b72;--success:#3fb950;--warn:#d29922;
        --navy:#102a43;--gold:#d4a017;
        --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
       min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--navy);padding:14px 20px;display:flex;
          align-items:center;gap:10px;position:sticky;top:0;z-index:100;
          border-bottom:1px solid rgba(255,255,255,.06);}
  .back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .topbar h1{font-family:var(--font-head);font-size:16px;font-weight:700;}
  .main{flex:1;padding:16px;max-width:900px;margin:0 auto;width:100%;}
  .esc-card{background:var(--surface);border:1px solid var(--border);
            border-radius:12px;padding:14px;margin-bottom:10px;
            cursor:pointer;transition:border-color .2s;}
  .esc-card:hover{border-color:rgba(88,166,255,.3);}
  .esc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .esc-ref{font-family:monospace;font-size:13px;font-weight:600;color:var(--accent);}
  .esc-station{font-size:12px;color:var(--gray);margin-top:4px;}
  .esc-meta{font-size:11px;color:var(--gray);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;}
  .b-open{background:rgba(248,81,73,.15);color:var(--danger2);}
  .b-review{background:rgba(210,153,34,.15);color:var(--warn);}
  .b-resolved{background:rgba(63,185,80,.15);color:var(--success);}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
           z-index:200;align-items:flex-end;}
  .overlay.open{display:flex;}
  .sheet{background:var(--surface);border-radius:16px 16px 0 0;
         width:100%;max-height:88vh;overflow-y:auto;padding:20px;}
  .sheet-handle{width:40px;height:4px;background:var(--border);
                border-radius:2px;margin:0 auto 16px;}
  .sheet h2{font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:14px;}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);
        border-radius:8px;padding:3px;margin-bottom:14px;}
  .tab{flex:1;padding:7px;text-align:center;font-size:12px;border-radius:6px;
       cursor:pointer;border:none;background:transparent;color:var(--gray);
       font-family:var(--font-body);}
  .tab.active{background:var(--accent);color:#0d1117;font-weight:600;}
  .detail-row{display:flex;justify-content:space-between;
              padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{color:var(--gray);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:12px;color:var(--gray);}
  .field select,.field textarea{
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;color:var(--text);
    font-family:var(--font-body);font-size:13px;width:100%;}
  .field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .btn{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;
       cursor:pointer;border:none;font-family:var(--font-body);
       transition:opacity .2s;width:100%;margin-bottom:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#0d1117;font-weight:600;}
  .btn-success{background:rgba(63,185,80,.1);color:var(--success);
               border:1px solid rgba(63,185,80,.3);}
  .btn-ghost{background:transparent;color:var(--gray);border:1px solid var(--border);}
  .btn:hover:not(:disabled){opacity:.8;}
  .bottomnav{position:sticky;bottom:0;background:var(--surface);
             border-top:1px solid var(--border);
             display:flex;justify-content:space-around;padding:10px 0 14px;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:3px;
           background:none;border:none;color:var(--gray);cursor:pointer;
           font-family:var(--font-body);font-size:10px;padding:4px 10px;}
  .navitem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;}
  .navitem.active{color:var(--gold);}
  .loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray);padding:8px 0;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);
           border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
  .msg.success{background:rgba(63,185,80,.1);color:var(--success);
               border:1px solid rgba(63,185,80,.2);display:block;}
  .msg.error{background:rgba(248,81,73,.1);color:var(--danger2);
             border:1px solid rgba(248,81,73,.2);display:block;}
  .empty{font-size:12px;color:var(--gray);text-align:center;padding:12px 0;}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="goto('dashboard.html')">←</button>
  <h1>Police Escalations</h1>
</div>

<div class="main">
  <div id="msgBox" class="msg"></div>
  <div id="escList">
    <div class="loading"><div class="spinner"></div> Loading…</div>
  </div>
</div>

<!-- Detail / update / close sheet -->
<div class="overlay" id="overlay" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('detail')">Detail</button>
      <button class="tab"        onclick="switchTab('update')">Update status</button>
      <button class="tab"        onclick="switchTab('close')">Close</button>
    </div>

    <!-- Detail tab -->
    <div id="stDetail">
      <h2 id="sheetRef">Escalation</h2>
      <div id="sheetDetailBody"></div>
    </div>

    <!-- Update status tab -->
    <div id="stUpdate" style="display:none;">
      <h2>Update police status</h2>
      <div class="field">
        <label>New status</label>
        <select id="newStatus">
          <option value="acknowledged">Acknowledged — police confirmed receipt</option>
          <option value="dispatched">Dispatched — officers sent</option>
          <option value="closed">Closed — case closed</option>
          <option value="no_action">No action — police took no action</option>
        </select>
      </div>
      <div class="field">
        <label>Update notes (required)</label>
        <textarea id="updateNotes" rows="3"
                  placeholder="Document the police response…" maxlength="500"></textarea>
      </div>
      <button class="btn btn-primary" id="updateBtn" onclick="submitUpdate()">
        Update status
      </button>
      <button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>
    </div>

    <!-- Close tab -->
    <div id="stClose" style="display:none;">
      <h2>Close escalation</h2>
      <p style="font-size:12px;color:var(--gray);margin-bottom:14px;line-height:1.6;">
        Formally closing this escalation will also resolve the linked incident.
        This action is recorded in the audit trail.
      </p>
      <div class="field">
        <label>Final outcome notes (required)</label>
        <textarea id="outcomeNotes" rows="4"
                  placeholder="Document the final police response outcome…"
                  maxlength="500"></textarea>
      </div>
      <button class="btn btn-success" id="closeEscBtn" onclick="submitClose()">
        Close escalation
      </button>
      <button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>
    </div>

  </div>
</div>

<!-- Bottom nav -->
<div class="bottomnav">
  <button class="navitem" onclick="goHome()">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
    Home
  </button>
  <button class="navitem" onclick="goto('residents.html')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    Residents
  </button>
  <button class="navitem" onclick="goto('incidents.html')">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    Incidents
  </button>
  <button class="navitem" onclick="goto('payments.html')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    Payments
  </button>
  <button class="navitem" onclick="goto('reports.html')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Reports
  </button>
</div>

<script>
const API = 'http://localhost/MIDSEC/api';
const token = localStorage.getItem('midview_token');
const user  = JSON.parse(localStorage.getItem('midview_user') || 'null');
if (!token || !user || user.role !== 'admin') {
  window.location.href = '../shared/login.html';
}
function authHeaders() {
  return { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json' };
}
function handleUnauth() {
  localStorage.removeItem('midview_token');
  localStorage.removeItem('midview_user');
  window.location.href = '../shared/login.html';
}
function goto(p) { window.location.href = p; }

let currentId = null;

const typeLabel = t => ({
  suspicious_activity:'Suspicious activity',
  theft_breakin:'Theft / break-in',
  property_damage:'Property damage',
}[t]||t);

const incBadge = s => ({
  open:'<span class="badge b-open">Open</span>',
  under_review:'<span class="badge b-review">Under review</span>',
  resolved:'<span class="badge b-resolved">Resolved</span>',
}[s]||s);

// ---- Load all escalations ----------------------------------
// GET /api/police — guard/admin only
async function loadEscalations() {
  try {
    const res  = await fetch(`${API}/police`, { headers: authHeaders() });
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();
    const el   = document.getElementById('escList');

    if (!data.success||!data.data?.length) {
      el.innerHTML='<p class="empty">No police escalations on record.</p>'; return;
    }

    el.innerHTML = data.data.map(e=>`
      <div class="esc-card" onclick="openEscalation(${e.escalation_id})">
        <div class="esc-top">
          <span class="esc-ref">${e.reference_code}</span>
          ${incBadge(e.incident_status)}
        </div>
        <div class="esc-station">🚔 ${e.station_name}</div>
        <div class="esc-meta">
          <span>👤 ${e.resident_name} · 🏠 ${e.house_no}</span>
          <span>📋 ${typeLabel(e.incident_type)}</span>
          <span>🗓 ${new Date(e.escalated_at).toLocaleDateString()}</span>
          <span>👮 ${e.escalated_by_name}</span>
        </div>
      </div>`).join('');
  } catch {
    document.getElementById('escList').innerHTML =
      '<p class="empty">Could not load escalations.</p>';
  }
}

// ---- Open escalation detail --------------------------------
async function openEscalation(id) {
  currentId = id;
  switchTab('detail');
  document.getElementById('sheetDetailBody').innerHTML =
    '<div class="loading"><div class="spinner"></div></div>';
  document.getElementById('overlay').classList.add('open');

  try {
    const res  = await fetch(`${API}/police/${id}`, { headers: authHeaders() });
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();
    if (!data.success) return;
    const e = data.data;

    document.getElementById('sheetRef').textContent = e.reference_code;
    document.getElementById('sheetDetailBody').innerHTML = `
      <div class="detail-row"><span class="detail-label">Station</span>
        <span>🚔 ${e.station_name}</span></div>
      <div class="detail-row"><span class="detail-label">Incident</span>
        <span>${typeLabel(e.incident_type)}</span></div>
      <div class="detail-row"><span class="detail-label">Incident status</span>
        ${incBadge(e.incident_status)}</div>
      <div class="detail-row"><span class="detail-label">Resident</span>
        <span>${e.resident_name} · 🏠 ${e.house_no}</span></div>
      ${e.resident_phone?`<div class="detail-row">
        <span class="detail-label">Phone</span>
        <a href="tel:${e.resident_phone}" style="color:var(--accent)">
          ${e.resident_phone}
        </a></div>`:''}
      <div class="detail-row"><span class="detail-label">Escalated by</span>
        <span>${e.escalated_by_name} (${e.escalated_by_role})</span></div>
      <div class="detail-row"><span class="detail-label">Date</span>
        <span>${new Date(e.escalated_at).toLocaleString()}</span></div>
      ${e.notes?`<div class="detail-row"><span class="detail-label">Notes</span>
        <span style="text-align:right;max-width:55%">${e.notes}</span></div>`:''}
      ${e.cctv_url?`<div class="detail-row"><span class="detail-label">CCTV</span>
        <a href="${e.cctv_url}" target="_blank" rel="noopener"
           style="color:var(--accent)">View feed ↗</a></div>`:''}`;

  } catch {
    document.getElementById('sheetDetailBody').innerHTML =
      '<p class="empty">Could not load detail.</p>';
  }
}

// ---- Submit status update ----------------------------------
// PATCH /api/police/{id}/status
async function submitUpdate() {
  const status = document.getElementById('newStatus').value;
  const notes  = document.getElementById('updateNotes').value.trim();
  if (!notes) { showMsg('Update notes are required.','error'); return; }

  const btn=document.getElementById('updateBtn');
  btn.disabled=true; btn.textContent='Updating…';

  try {
    const res=await fetch(`${API}/police/${currentId}/status`,{
      method:'PATCH', headers:authHeaders(),
      body:JSON.stringify({ status, update_notes: notes }),
    });
    if (res.status===401) { handleUnauth(); return; }
    const data=await res.json();
    if (res.ok&&data.success) {
      const autoResolved = ['closed','no_action'].includes(status);
      showMsg(
        autoResolved
          ? 'Status updated. Linked incident automatically resolved.'
          : 'Escalation status updated.',
        'success'
      );
      closeOverlay(); loadEscalations();
    } else {
      showMsg(data.message||'Update failed.','error');
    }
  } catch { showMsg('Server error.','error'); }
  finally { btn.disabled=false; btn.textContent='Update status'; }
}

// ---- Submit close ------------------------------------------
// PATCH /api/police/{id}/close
async function submitClose() {
  const notes=document.getElementById('outcomeNotes').value.trim();
  if (!notes) { showMsg('Outcome notes are required.','error'); return; }

  const btn=document.getElementById('closeEscBtn');
  btn.disabled=true; btn.textContent='Closing…';

  try {
    const res=await fetch(`${API}/police/${currentId}/close`,{
      method:'PATCH', headers:authHeaders(),
      body:JSON.stringify({ outcome_notes: notes }),
    });
    if (res.status===401) { handleUnauth(); return; }
    const data=await res.json();
    if (res.ok&&data.success) {
      showMsg('Escalation closed. Linked incident resolved.','success');
      closeOverlay(); loadEscalations();
    } else {
      showMsg(data.message||'Close failed.','error');
    }
  } catch { showMsg('Server error.','error'); }
  finally { btn.disabled=false; btn.textContent='Close escalation'; }
}

function switchTab(tab) {
  ['detail','update','close'].forEach(t=>{
    document.getElementById(`st${t.charAt(0).toUpperCase()+t.slice(1)}`)
      .style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('active',['detail','update','close'][i]===tab);
  });
}

function showMsg(t,type) {
  const el=document.getElementById('msgBox');
  el.textContent=t; el.className=`msg ${type}`;
  setTimeout(()=>{el.className='msg';},5000);
}
function closeOverlay() { document.getElementById('overlay').classList.remove('open'); }
function closeSheet(e)  { if(e.target===document.getElementById('overlay')) closeOverlay(); }

//go home navigation
function goHome() {
  window.location.href = `../${user.role}/dashboard.html`;
}



loadEscalations();
</script>
</body>
</html>
