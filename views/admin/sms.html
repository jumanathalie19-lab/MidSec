<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Midview Admin — SMS Logs</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:rgba(255,255,255,.08);
        --text:#e6edf3;--gray:#7d8590;--accent:#58a6ff;
        --danger2:#ff7b72;--success:#3fb950;--warn:#d29922;
        --navy:#102a43;--gold:#d4a017;
        --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
       min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--navy);padding:14px 20px;display:flex;
          align-items:center;gap:10px;position:sticky;top:0;z-index:100;
          border-bottom:1px solid rgba(255,255,255,.06);}
  .back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .topbar h1{font-family:var(--font-head);font-size:16px;font-weight:700;}
  .main{flex:1;padding:16px;max-width:900px;margin:0 auto;width:100%;}
  /* Stats row */
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);
             border-radius:10px;padding:12px;text-align:center;}
  .stat-card .num{font-family:var(--font-head);font-size:22px;font-weight:700;}
  .stat-card .lbl{font-size:11px;color:var(--gray);margin-top:3px;}
  .num-success{color:var(--success);} .num-warn{color:var(--warn);}
  .num-danger{color:var(--danger2);}
  /* Tabs */
  .tabs{display:flex;gap:4px;background:var(--surface);border-radius:10px;
        padding:4px;margin-bottom:14px;}
  .tab{flex:1;padding:8px;text-align:center;font-size:12px;border-radius:8px;
       cursor:pointer;border:none;background:transparent;color:var(--gray);
       font-family:var(--font-body);}
  .tab.active{background:var(--accent);color:#0d1117;font-weight:600;}
  /* Filter row */
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .filter-row label{font-size:12px;color:var(--gray);}
  .filter-row input{background:var(--surface);border:1px solid var(--border);
                    color:var(--text);padding:6px 10px;border-radius:8px;
                    font-family:var(--font-body);font-size:12px;}
  .filter-btn{background:var(--surface);border:1px solid var(--border);
              color:var(--gray);padding:5px 12px;border-radius:20px;
              font-size:12px;cursor:pointer;font-family:var(--font-body);}
  .filter-btn.active{background:var(--accent);color:#0d1117;
                     border-color:var(--accent);font-weight:600;}
  /* SMS rows */
  .sms-row{display:flex;align-items:flex-start;gap:10px;
           padding:12px 0;border-bottom:1px solid var(--border);}
  .sms-row:last-child{border-bottom:none;}
  .sms-icon{width:34px;height:34px;border-radius:50%;flex-shrink:0;
            background:rgba(88,166,255,.1);color:var(--accent);
            display:flex;align-items:center;justify-content:center;font-size:14px;}
  .sms-info{flex:1;min-width:0;}
  .sms-msg{font-size:12px;line-height:1.5;margin-bottom:4px;}
  .sms-sub{font-size:11px;color:var(--gray);}
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;}
  .b-delivered{background:rgba(63,185,80,.15);color:var(--success);}
  .b-sent{background:rgba(88,166,255,.12);color:var(--accent);}
  .b-failed{background:rgba(248,81,73,.15);color:var(--danger2);}
  /* Guard performance table */
  .perf-table{width:100%;border-collapse:collapse;font-size:12px;}
  .perf-table th{color:var(--gray);font-weight:500;text-align:left;
                 padding:6px 8px;border-bottom:1px solid var(--border);}
  .perf-table td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
  .perf-table tr:last-child td{border-bottom:none;}
  .card{background:var(--surface);border:1px solid var(--border);
        border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h3{font-family:var(--font-head);font-size:13px;font-weight:600;
           color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
  .bottomnav{position:sticky;bottom:0;background:var(--surface);
             border-top:1px solid var(--border);
             display:flex;justify-content:space-around;padding:10px 0 14px;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:3px;
           background:none;border:none;color:var(--gray);cursor:pointer;
           font-family:var(--font-body);font-size:10px;padding:4px 10px;}
  .navitem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;}
  .navitem.active{color:var(--gold);}
  .loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray);padding:8px 0;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);
           border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{font-size:12px;color:var(--gray);text-align:center;padding:12px 0;}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="goto('dashboard.html')">←</button>
  <h1>SMS Audit Logs</h1>
</div>

<div class="main">

  <!-- Stats (loaded from statistics endpoint) -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="num num-success" id="statDelivered">—</div>
      <div class="lbl">Delivered</div>
    </div>
    <div class="stat-card">
      <div class="num num-warn" id="statSent">—</div>
      <div class="lbl">Sent (unconfirmed)</div>
    </div>
    <div class="stat-card">
      <div class="num num-danger" id="statFailed">—</div>
      <div class="lbl">Failed</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('logs')">SMS logs</button>
    <button class="tab"        onclick="showTab('stats')">Guard stats</button>
  </div>

  <!-- Logs tab -->
  <div id="tabLogs">
    <div class="filter-row">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="delivered">Delivered</button>
      <button class="filter-btn" data-status="sent">Sent</button>
      <button class="filter-btn" data-status="failed">Failed</button>
    </div>
    <div class="filter-row">
      <label>From</label>
      <input type="date" id="dateFrom"/>
      <label>To</label>
      <input type="date" id="dateTo"/>
    </div>
    <div id="logList">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- Guard stats tab -->
  <div id="tabStats" style="display:none;">
    <div class="card">
      <h3>Guard SMS activity</h3>
      <div id="guardStats">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>
  </div>

</div>

<!-- Bottom nav -->
<div class="bottomnav">
  <button class="navitem" onclick="goHome()">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
    Home
  </button>
  <button class="navitem" onclick="goto('residents.html')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    Residents
  </button>
  <button class="navitem" onclick="goto('incidents.html')">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    Incidents
  </button>
  <button class="navitem" onclick="goto('payments.html')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    Payments
  </button>
  <button class="navitem" onclick="goto('reports.html')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Reports
  </button>
</div>

<script>
// ============================================================
//  Midview Admin — SMS Logs
//  APIs: GET /api/sms              — all logs (admin only)
//        GET /api/sms/statistics   — delivery stats (admin only)
//  recipient_phone returned to admin by the procedure.
// ============================================================
const API = 'http://localhost/MIDSEC/api';
const token = localStorage.getItem('midview_token');
const user  = JSON.parse(localStorage.getItem('midview_user') || 'null');
if (!token || !user || user.role !== 'admin') {
  window.location.href = '../shared/login.html';
}
function authHeaders() {
  return { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json' };
}
function handleUnauth() {
  localStorage.removeItem('midview_token');
  localStorage.removeItem('midview_user');
  window.location.href = '../shared/login.html';
}
function goto(p) { window.location.href = p; }

let activeStatus = '';

// Set default dates
(function() {
  const now  = new Date();
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  document.getElementById('dateTo').value   = now.toISOString().slice(0,10);
})();

// ---- Filter pills ------------------------------------------
document.querySelectorAll('[data-status]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-status]').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    activeStatus = this.dataset.status;
    loadLogs();
  });
});

// ---- Tabs --------------------------------------------------
function showTab(tab) {
  document.getElementById('tabLogs').style.display  = tab==='logs'  ? 'block':'none';
  document.getElementById('tabStats').style.display = tab==='stats' ? 'block':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('active',['logs','stats'][i]===tab);
  });
  if (tab==='stats') loadStats();
}

// ---- Load SMS logs -----------------------------------------
// GET /api/sms — admin only, contains recipient_phone
async function loadLogs() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  const el   = document.getElementById('logList');
  el.innerHTML='<div class="loading"><div class="spinner"></div> Loading…</div>';

  let url = `${API}/sms`;
  const params = new URLSearchParams();
  if (activeStatus) params.set('status', activeStatus);
  if (from)         params.set('date_from', from);
  if (to)           params.set('date_to',   to);
  if ([...params].length) url += '?' + params.toString();

  try {
    const res  = await fetch(url, { headers: authHeaders() });
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();

    if (!data.success||!data.data?.length) {
      el.innerHTML='<p class="empty">No SMS records found.</p>'; return;
    }

    const badge = s => ({
      delivered:'<span class="badge b-delivered">Delivered</span>',
      sent:     '<span class="badge b-sent">Sent</span>',
      failed:   '<span class="badge b-failed">Failed</span>',
    }[s]||s);

    el.innerHTML = data.data.map(s=>`
      <div class="sms-row">
        <div class="sms-icon">💬</div>
        <div class="sms-info">
          <div class="sms-msg">${s.message}</div>
          <div class="sms-sub">
            📞 ${s.recipient_phone}
            · 👤 ${s.resident_name} (🏠 ${s.house_no})
            · 👮 ${s.guard_name}
          </div>
          <div class="sms-sub">
            📋 ${s.incident_type}
            · 🕐 ${new Date(s.sent_at).toLocaleString()}
          </div>
        </div>
        ${badge(s.delivery_status)}
      </div>`).join('');
  } catch {
    el.innerHTML='<p class="empty">Could not load SMS logs.</p>';
  }
}

// ---- Load statistics ----------------------------------------
// GET /api/sms/statistics — 2 result sets
async function loadStats() {
  try {
    const res  = await fetch(`${API}/sms/statistics`, { headers: authHeaders() });
    if (res.status===401) { handleUnauth(); return; }
    const data = await res.json();
    if (!data.success) return;

    const ov = data.data.overall_delivery || {};
    const gd = data.data.guard_activity   || [];

    document.getElementById('statDelivered').textContent = ov.total_delivered ?? '—';
    document.getElementById('statSent').textContent      = ov.total_sent      ?? '—';
    document.getElementById('statFailed').textContent    = ov.total_failed    ?? '—';

    const el = document.getElementById('guardStats');
    if (!gd.length) {
      el.innerHTML='<p class="empty">No guard SMS activity.</p>'; return;
    }

    el.innerHTML = `
      <table class="perf-table">
        <thead>
          <tr>
            <th>Guard</th>
            <th>Sent</th>
            <th>Delivered</th>
            <th>Failed</th>
            <th>Fail %</th>
            <th>Incidents</th>
          </tr>
        </thead>
        <tbody>
          ${gd.map(g=>`
            <tr>
              <td>${g.guard_name}</td>
              <td>${g.total_sms_sent}</td>
              <td>${g.delivered_count}</td>
              <td style="color:${g.failed_count>0?'var(--danger2)':'var(--text)'}">${g.failed_count}</td>
              <td style="color:${g.failure_rate_pct>20?'var(--danger2)':g.failure_rate_pct>10?'var(--warn)':'var(--success)'}">${g.failure_rate_pct}%</td>
              <td>${g.unique_incidents_handled}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch {}
}
//go home navigation
function goHome(){
  window.location.href=`../${user.role}/dashboard.html`;
}
loadLogs();
loadStats();
</script>
</body>
</html>
